<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据源明细 · 中建一局集采计划预测</title>
<style>
:root{--navy:#0b355c;--blue:#17679f;--orange:#ed7d31;--ink:#182b3d;--muted:#687b8e;--line:#dce5ec;--paper:#f3f7fa;--soft:#eaf4fa;--shadow:0 7px 22px rgba(18,54,82,.08)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}h1,h2,p{margin-top:0}.top{height:64px;padding:0 max(24px,calc((100vw - 1380px)/2));display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;box-shadow:0 3px 18px rgba(5,31,52,.22)}.brand{display:flex;gap:11px;align-items:center}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:7px;background:#fff;color:var(--navy);font-size:18px;font-weight:900}.brand b{display:block;font-size:16px}.brand small{display:block;color:#bdd5e7}.back{padding:7px 10px;border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#fff}.back:hover{background:rgba(255,255,255,.1)}main{max-width:1380px;margin:auto;padding:28px 24px 70px}.eyebrow{margin-bottom:5px;color:var(--orange);font-size:12px;font-weight:750;letter-spacing:.7px}h1{margin-bottom:7px;font-size:clamp(25px,3vw,34px)}.subtitle{margin:0;color:var(--muted)}.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.btn{min-height:36px;padding:7px 13px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-weight:650}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn:disabled{cursor:not-allowed;opacity:.45}.btn.sm{min-height:30px;padding:4px 9px;font-size:12px}.btn.link{color:var(--blue);border-color:#bad7e8;background:#f1f8fc}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:15px 17px;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:var(--shadow)}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:2px;color:var(--blue);font-size:23px}.panel{min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:var(--shadow)}.panel-head{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:17px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.controls select,.controls input{min-height:32px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}.table-wrap{overflow:auto;max-height:68vh}.raw-table{border-collapse:collapse;min-width:100%;width:max-content}.raw-table th{position:sticky;top:0;z-index:2;padding:11px 12px;text-align:left;white-space:nowrap;color:#4e6274;background:#f4f7f9;border-bottom:1px solid var(--line);font-size:12px}.raw-table td{max-width:270px;padding:10px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid #eaf0f4}.raw-table tbody tr:hover{background:#fafcfe}.raw-table th:first-child,.raw-table td:first-child{position:sticky;left:0;z-index:1;min-width:62px;background:#fff}.raw-table th:first-child{z-index:3;background:#f4f7f9}.raw-table tbody tr:hover td:first-child{background:#fafcfe}.raw-table .primary-cell{font-weight:650;color:var(--blue)}.empty{padding:32px!important;color:var(--muted);text-align:center}.footer{padding:13px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line)}.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pager input{width:68px;min-height:31px;padding:4px 7px;text-align:center;border:1px solid var(--line);border-radius:5px}.pager span{color:var(--muted);font-size:12px}.note{margin-top:12px;color:var(--muted);font-size:12px}dialog{width:min(920px,calc(100vw - 32px));max-height:84vh;padding:0;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(8,36,58,.22)}dialog::backdrop{background:rgba(8,36,58,.55)}.dialog-head{position:sticky;top:0;padding:17px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center;background:#fff;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:20px}.detail-grid{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail{min-width:0;padding:10px;border-radius:6px;background:#f5f8fa}.detail span{display:block;color:var(--muted);font-size:12px}.detail b{display:block;overflow-wrap:anywhere;font-weight:600}.error{margin:30px auto;max-width:850px;padding:20px;border:1px solid #efc5c5;border-radius:8px;background:#fff2f2;color:#a33232}@media(max-width:850px){.headline,.panel-head,.footer{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.top{padding:0 16px}main{padding:22px 16px 50px}}@media(max-width:520px){.stats{grid-template-columns:1fr}.brand small{display:none}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">中</div><div><b>中建一局 · 集采计划预测</b><small>原始数据明细</small></div></div><a class="back" href="index.html#data">返回演示系统</a></header>
<main id="app">
  <div class="headline"><div><span class="eyebrow">02 · 数据底座 / 原始记录</span><h1 id="sourceTitle">加载数据源...</h1><p class="subtitle" id="sourceFile"></p></div><a class="btn" href="index.html#data">返回数据源列表</a></div>
  <div class="stats"><div class="stat"><span>原始记录</span><strong id="rowCount">—</strong></div><div class="stat"><span>展示字段</span><strong id="fieldCount">—</strong></div><div class="stat"><span>当前页</span><strong id="currentPageStat">—</strong></div></div>
  <section class="panel"><div class="panel-head"><div><h2>数据列表</h2><p id="listHint">默认显示常用字段；点击“全部字段”可查看单条完整记录。</p></div><div class="controls"><label>每页 <select id="pageSize"><option value="25">25 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label><label><input id="showAll" type="checkbox"> 表格展示全部字段</label></div></div><div class="table-wrap"><table class="raw-table"><thead id="tableHead"></thead><tbody id="tableBody"><tr><td class="empty">正在读取原始记录...</td></tr></tbody></table></div><div class="footer"><span id="rangeText">—</span><div class="pager"><button class="btn sm" id="firstPage">首页</button><button class="btn sm" id="prevPage">上一页</button><span id="pageText">—</span><button class="btn sm" id="nextPage">下一页</button><button class="btn sm" id="lastPage">末页</button><span>跳至</span><input type="number" min="1" id="jumpPage" aria-label="跳转页码"><button class="btn sm" id="jumpButton">跳转</button></div></div></section>
  <p class="note" id="sheetNote"></p>
</main>
<dialog id="rowDialog"><div class="dialog-head"><div><span class="eyebrow">原始记录</span><h2 id="dialogTitle"></h2></div><button class="btn sm" id="dialogClose">关闭</button></div><div class="detail-grid" id="dialogFields"></div></dialog>
<script src="source-data/manifest.js"></script>
<script>
(()=>{
  const manifest=window.FORECAST_SOURCE_MANIFEST||{},id=new URLSearchParams(location.search).get('source'),source=manifest[id],$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v).toLocaleString('zh-CN');
  if(!source){$('#app').innerHTML='<div class="error"><b>未找到这个数据源。</b><p>请从演示系统的“数据源明细与用途”表格进入。</p><a class="btn" href="index.html#data">返回数据源列表</a></div>';return}
  let page=1,size=25,allFields=false,requestToken=0,currentRows=[],currentStart=0;
  const cache=new Map(),pending=new Map(),totalPages=()=>Math.max(1,Math.ceil(source.rows/size)),key=n=>`${id}-${n}`;
  window.receiveForecastSourceChunk=async chunk=>{if(chunk.id!==id)return;const k=key(chunk.index),wait=pending.get(k);try{if(!window.DecompressionStream)throw new Error('浏览器不支持解压原始数据');const bytes=Uint8Array.from(atob(chunk.gzip),c=>c.charCodeAt(0)),text=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),rows=JSON.parse(text);cache.set(k,rows);if(cache.size>4)cache.delete(cache.keys().next().value);if(wait){pending.delete(k);wait.resolve(rows)}}catch(error){if(wait){pending.delete(k);wait.reject(error)}}};
  function loadChunk(index){const k=key(index);if(cache.has(k))return Promise.resolve(cache.get(k));if(pending.has(k))return pending.get(k).promise;let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b});pending.set(k,{promise,resolve,reject});const script=document.createElement('script');script.src=`source-data/${id}-${String(index).padStart(4,'0')}.js`;script.onload=()=>script.remove();script.onerror=()=>{pending.delete(k);script.remove();reject(new Error('数据文件读取失败'))};document.head.appendChild(script);return promise}
  function value(v){return v===null||v===undefined||v===''?'<span style="color:#9cabb7">—</span>':esc(v)}
  function columns(){return allFields?source.columns:source.preferred}
  function paint(rows,start){currentRows=rows;currentStart=start;const cols=columns(),positions=cols.map(c=>source.columns.indexOf(c));$('#tableHead').innerHTML=`<tr><th>序号</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>操作</th></tr>`;$('#tableBody').innerHTML=rows.length?rows.map((row,i)=>`<tr><td>${num(start+i+1)}</td>${positions.map((at,j)=>`<td class="${j===1?'primary-cell':''}" title="${esc(row[at]??'')}">${value(row[at])}</td>`).join('')}<td><button class="btn sm link" data-row="${i}">全部字段</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+2}" class="empty">没有数据</td></tr>`}
  async function showPage(next){page=Math.max(1,Math.min(Number(next)||1,totalPages()));const token=++requestToken,start=(page-1)*size,end=Math.min(start+size,source.rows),first=Math.floor(start/source.chunkSize),last=Math.floor((Math.max(start,end-1))/source.chunkSize);$('#tableBody').innerHTML=`<tr><td colspan="${columns().length+2}" class="empty">正在读取第 ${num(page)} 页...</td></tr>`;$('#pageText').textContent=`${num(page)} / ${num(totalPages())}`;$('#currentPageStat').textContent=num(page);$('#rangeText').textContent=`显示 ${num(start+1)}—${num(end)} 条，共 ${num(source.rows)} 条`;$('#jumpPage').value=page;$('#jumpPage').max=totalPages();$('#firstPage').disabled=$('#prevPage').disabled=page===1;$('#lastPage').disabled=$('#nextPage').disabled=page===totalPages();try{const blocks=await Promise.all(Array.from({length:last-first+1},(_,i)=>loadChunk(first+i)));if(token!==requestToken)return;const combined=blocks.flat(),offset=start-first*source.chunkSize;paint(combined.slice(offset,offset+size),start)}catch(error){if(token!==requestToken)return;$('#tableBody').innerHTML=`<tr><td class="empty" colspan="${columns().length+2}">读取失败，请检查 source-data 文件是否完整，然后刷新页面。</td></tr>`}}
  function rowDetail(index){const row=currentRows[index];if(!row)return;$('#dialogTitle').textContent=`${source.label} · 第 ${num(currentStart+index+1)} 条`;$('#dialogFields').innerHTML=source.columns.map((name,i)=>`<div class="detail"><span>${esc(name)}</span><b>${value(row[i])}</b></div>`).join('');$('#rowDialog').showModal()}
  $('#sourceTitle').textContent=source.label;$('#sourceFile').textContent=`原始文件：${source.filename}`;$('#rowCount').textContent=num(source.rows);$('#fieldCount').textContent=num(source.columns.length);$('#sheetNote').textContent=source.sheets.length?`原始工作表：${source.sheets.map(x=>`${x.name} ${num(x.rows)} 条`).join('，')}。${id.startsWith('plan')?'不同工作表的字段按名称合并展示，来源工作表保留在第一列；所以展示字段数可能大于主页的单表字段数。':''}`:`字段和值按原始 CSV 文件展示；空值显示为“—”。${source.omittedEmptyColumns?`原文件另有 ${num(source.omittedEmptyColumns)} 列完全为空的无标题列，列表中已省略。`:''}`;
  $('#pageSize').onchange=e=>{size=Number(e.target.value);showPage(1)};$('#showAll').onchange=e=>{allFields=e.target.checked;paint(currentRows,currentStart)};
  $('#firstPage').onclick=()=>showPage(1);$('#prevPage').onclick=()=>showPage(page-1);$('#nextPage').onclick=()=>showPage(page+1);$('#lastPage').onclick=()=>showPage(totalPages());$('#jumpButton').onclick=()=>showPage($('#jumpPage').value);$('#jumpPage').onkeydown=e=>{if(e.key==='Enter')showPage(e.target.value)};
  $('#tableBody').onclick=e=>{const button=e.target.closest('[data-row]');if(button)rowDetail(Number(button.dataset.row))};$('#dialogClose').onclick=()=>$('#rowDialog').close();$('#rowDialog').onclick=e=>{if(e.target===$('#rowDialog'))$('#rowDialog').close()};
  showPage(1);
})();
</script>
</body>
</html>
