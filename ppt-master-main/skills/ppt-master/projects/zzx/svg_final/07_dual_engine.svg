<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="page-background" data-pptx-role="background" width="1280" height="720" fill="#F4F8FD"/>
  <g id="header" data-pptx-bounds="28 18 1224 90"><text x="34" y="57" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">07｜规则与 AI 双引擎协同</text><text x="34" y="87" font-family="PingFang SC" font-size="17" fill="#5A6C82">确定性问题用规则，复杂性问题用 AI，结果统一汇总、分级并返回业务流程</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g>
  <g id="rule-engine" data-pptx-bounds="32 130 510 430"><rect x="32" y="130" width="510" height="430" rx="20" fill="#FFFFFF" stroke="#0753B8" stroke-width="2"/><rect x="32" y="130" width="510" height="62" rx="20" fill="#0753B8"/><text x="287" y="170" text-anchor="middle" font-family="PingFang SC" font-size="27" font-weight="700" fill="#FFFFFF">规则引擎｜确定性问题</text><text x="62" y="232" font-family="PingFang SC" font-size="17" fill="#1B2638">对标准结构化数据执行条件匹配、阈值判断和关系计算，</text><text x="62" y="260" font-family="PingFang SC" font-size="17" fill="#1B2638">速度快、结果稳定、依据清晰。</text><rect x="58" y="288" width="140" height="72" rx="14" fill="#E8F3FF"/><rect x="217" y="288" width="140" height="72" rx="14" fill="#E8F3FF"/><rect x="376" y="288" width="140" height="72" rx="14" fill="#E8F3FF"/><text x="128" y="333" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#0753B8">条件匹配</text><text x="287" y="333" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#0753B8">阈值判断</text><text x="446" y="333" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#0753B8">关系计算</text><text x="58" y="397" font-family="PingFang SC" font-size="16" font-weight="700" fill="#083F91">代表场景</text><text x="58" y="433" font-family="PingFang SC" font-size="17" fill="#52677F">字段缺失　资质失效</text><text x="58" y="469" font-family="PingFang SC" font-size="17" fill="#52677F">工商关联　精确信息重叠</text><text x="58" y="515" font-family="PingFang SC" font-size="14" fill="#6F7F94">适用于条件清晰、字段明确、结果可重复验证的问题</text></g>
  <g id="ai-engine" data-pptx-bounds="738 130 510 430"><rect x="738" y="130" width="510" height="430" rx="20" fill="#FFFFFF" stroke="#7B61C9" stroke-width="2"/><rect x="738" y="130" width="510" height="62" rx="20" fill="#7B61C9"/><text x="993" y="170" text-anchor="middle" font-family="PingFang SC" font-size="27" font-weight="700" fill="#FFFFFF">AI 引擎｜复杂性问题</text><text x="768" y="232" font-family="PingFang SC" font-size="17" fill="#1B2638">对公告、附件、清单和合同等非结构化材料进行语义理解</text><text x="768" y="260" font-family="PingFang SC" font-size="17" fill="#1B2638">与跨文件比对，覆盖规则难以穷举的复杂风险。</text><rect x="764" y="288" width="140" height="72" rx="14" fill="#F1EDFF"/><rect x="923" y="288" width="140" height="72" rx="14" fill="#F1EDFF"/><rect x="1082" y="288" width="140" height="72" rx="14" fill="#F1EDFF"/><text x="834" y="333" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#7B61C9">语义理解</text><text x="993" y="333" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#7B61C9">知识检索</text><text x="1152" y="333" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#7B61C9">跨文件比对</text><text x="764" y="397" font-family="PingFang SC" font-size="16" font-weight="700" fill="#7B61C9">代表场景</text><text x="764" y="433" font-family="PingFang SC" font-size="17" fill="#52677F">排斥性条款　附件符合性</text><text x="764" y="469" font-family="PingFang SC" font-size="17" fill="#52677F">异常相似　合同条款偏离</text><text x="764" y="515" font-family="PingFang SC" font-size="14" fill="#6F7F94">适用于需要上下文理解、模糊相似和跨附件关联的问题</text></g>
  <g id="collaboration" data-pptx-bounds="548 228 184 226"><circle cx="640" cy="326" r="78" fill="#FFFFFF" stroke="#BCD3EC" stroke-width="3"/><text x="640" y="312" text-anchor="middle" font-family="PingFang SC" font-size="29" font-weight="700" fill="#0753B8">规则</text><text x="640" y="349" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#FF6B20">+</text><text x="640" y="386" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#7B61C9">AI</text><line x1="542" y1="326" x2="562" y2="326" stroke="#BCD3EC" stroke-width="5"/><line x1="718" y1="326" x2="738" y2="326" stroke="#BCD3EC" stroke-width="5"/></g>
  <g id="output" data-pptx-bounds="32 586 1216 104"><rect x="32" y="586" width="1216" height="94" rx="18" fill="#FFFFFF" stroke="#BCD3EC"/><text x="58" y="622" font-family="PingFang SC" font-size="22" font-weight="700" fill="#083F91">统一输出</text><text x="220" y="622" font-family="PingFang SC" font-size="18" fill="#52677F">风险结论 + 命中证据 + 判断依据</text><rect x="702" y="606" width="148" height="48" rx="24" fill="#E8F7EF"/><rect x="868" y="606" width="166" height="48" rx="24" fill="#FFF4DE"/><rect x="1052" y="606" width="166" height="48" rx="24" fill="#FFE9E6"/><text x="776" y="637" text-anchor="middle" font-family="PingFang SC" font-size="17" font-weight="700" fill="#268A50">通过</text><text x="951" y="637" text-anchor="middle" font-family="PingFang SC" font-size="17" font-weight="700" fill="#C98700">提示 / 复核</text><text x="1135" y="637" text-anchor="middle" font-family="PingFang SC" font-size="17" font-weight="700" fill="#D94F4F">预警 / 拦截</text></g>
</svg>
