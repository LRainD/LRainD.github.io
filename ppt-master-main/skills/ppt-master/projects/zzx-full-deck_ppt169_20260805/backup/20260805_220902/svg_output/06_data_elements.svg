<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F6F9FD"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">06｜数据要素：从原始数据到监管证据</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">治理、关联、知识化与场景调用，让分散数据成为可计算、可追溯的数据要素</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g>
  <g id="value-chain" data-pptx-bounds="35 150 1210 330"><rect x="35" y="190" width="210" height="210" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="140" y="235" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#0753B8">原始数据</text><text x="140" y="278" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">文件｜交易｜主体</text><text x="140" y="309" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">信用｜法规｜反馈</text><circle cx="140" cy="355" r="24" fill="#E5F1FF"/><text x="140" y="362" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0753B8">01</text><polygon points="255,282 285,295 255,308" fill="#79AEE7"/><rect x="285" y="160" width="210" height="270" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="390" y="205" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#0753B8">治理加工</text><text x="390" y="250" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">接入｜清洗｜脱敏</text><text x="390" y="282" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">标准化｜质量校验</text><text x="390" y="314" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">主体对齐｜字段抽取</text><text x="390" y="346" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">关系构建｜规则标签</text><circle cx="390" cy="389" r="24" fill="#E5F1FF"/><text x="390" y="396" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0753B8">02</text><polygon points="505,282 535,295 505,308" fill="#79AEE7"/><rect x="535" y="140" width="210" height="310" rx="20" fill="#0753B8"/><text x="640" y="190" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#FFFFFF">数据要素产品</text><text x="640" y="242" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#DCEEFF">主体画像</text><text x="640" y="278" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#DCEEFF">资质状态</text><text x="640" y="314" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#DCEEFF">历史行为</text><text x="640" y="350" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#DCEEFF">风险特征</text><text x="640" y="386" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#DCEEFF">法规条款</text><polygon points="755,282 785,295 755,308" fill="#79AEE7"/><rect x="785" y="160" width="210" height="270" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="890" y="205" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#0753B8">场景调用</text><text x="890" y="255" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">规则引擎</text><text x="890" y="291" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">模型 Agent</text><text x="890" y="327" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">预警引擎</text><circle cx="890" cy="389" r="24" fill="#E5F1FF"/><text x="890" y="396" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0753B8">04</text><polygon points="1005,282 1035,295 1005,308" fill="#79AEE7"/><rect x="1035" y="190" width="210" height="210" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1140" y="235" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#42A96B">证据回写</text><text x="1140" y="278" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">识别结论｜证据位置</text><text x="1140" y="309" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">处置结果｜用户反馈</text><circle cx="1140" cy="355" r="24" fill="#E5F7EC"/><text x="1140" y="362" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#42A96B">05</text></g>
  <g id="cycle" data-pptx-bounds="100 510 1080 75"><rect x="100" y="510" width="1080" height="70" rx="20" fill="#E7F2FF"/><text x="640" y="553" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#0753B8">数据 → 知识 → 模型 / 规则 → 应用 → 反馈 → 数据</text></g>
