<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F5F9FF"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">16｜案例一：公告排斥性条款发布前拦截</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">在公告发布前定位疑似排斥性表述，给出依据并推动修改，避免风险进入交易环节</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g><g id="source-doc" data-pptx-bounds="45 145 400 465"><rect x="45" y="145" width="400" height="465" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><rect x="75" y="180" width="340" height="330" fill="#FAFCFF" stroke="#B6CDE7"/><text x="100" y="225" font-family="PingFang SC" font-size="20" font-weight="700" fill="#334A67">招标公告（脱敏示意）</text><line x1="100" y1="255" x2="375" y2="255" stroke="#C4D4E6"/><text x="100" y="295" font-family="PingFang SC" font-size="16" fill="#53677F">项目资格条件：</text><rect x="95" y="320" width="290" height="58" rx="8" fill="#FFF0E7" stroke="#FF9D63"/><text x="110" y="355" font-family="PingFang SC" font-size="15" fill="#D95C1A">疑似排斥性表述（待补充真实条款）</text><line x1="100" y1="405" x2="375" y2="405" stroke="#C4D4E6"/><line x1="100" y1="440" x2="340" y2="440" stroke="#C4D4E6"/><text x="245" y="565" text-anchor="middle" font-family="PingFang SC" font-size="14" fill="#7B8CA1">真实脱敏截图待补充</text></g><g id="ai-result" data-pptx-bounds="475 145 330 465"><rect x="475" y="145" width="330" height="465" rx="18" fill="#E8F3FF" stroke="#AFCBEA"/><rect x="520" y="185" width="240" height="70" rx="14" fill="#FFFFFF"/><text x="640" y="214" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#FF6B20">高风险 / 待核查</text><text x="640" y="240" text-anchor="middle" font-family="PingFang SC" font-size="14" fill="#53677F">AI 识别结果</text><text x="525" y="315" font-family="PingFang SC" font-size="17" font-weight="700"