<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F5F9FF"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">22｜推广与商业：标准产品叠加行业知识包</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">共性能力标准化、行业知识本地化、企业规则配置化，从集团内部向行业复制</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g><g id="path" data-pptx-bounds="45 150 420 470"><text x="45" y="185" font-family="PingFang SC" font-size="23" font-weight="700" fill="#0753B8">四阶段推广路径</text><rect x="70" y="515" width="320" height="70" rx="10" fill="#0753B8"/><rect x="105" y="425" width="285" height="70" rx="10" fill="#1971CC"/><rect x="140" y="335" width="250" height="70" rx="10" fill="#3188D7"/><rect x="175" y="245" width="215" height="70" rx="10" fill="#59A6DF"/><text x="230" y="559" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">试点验证</text><text x="247" y="469" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">集团推广</text><text x="265" y="379" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">建筑行业输出</text><text x="282" y="289" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">跨行业扩展</text><image href="../images/growth_path.png" x="270" y="180" width="160" height="130" preserveAspectRatio="xMidYMid meet"/></g><g id="product" data-pptx-bounds="480 150 390 470"><text x="480" y="185" font-family="PingFang SC" font-size="23" font-weight="700" fill="#0753B8">标准产品模块</text><rect x="500" y="225" width="350" height="80" rx="16" fill="#0753B8"/><text x="675" y="274" text-anchor="middle" font-family="PingFang SC" font-size="21" font-weight="700" fill="#FFFFFF">监管中台</text><rect x="520" y="325" width="310" height="70" rx="16" fill="#1971CC"/><text x="675" y="369" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">AI / 规则能力</text><rect x="540" y="415" width="270" height="70" rx="16" fill="#3188D7"/><text x="675" y="459" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">行业知识包</text><rect x="560" y="505" width="230" height="70" rx="16" fill="#7B61C9"/><text x="675" y="549" text-anchor="middle" font-family="PingFang SC" font-size="19" font-weight="700" fill="#FFFFFF">企业规则包 + 接口</text></g><g id="business" data-pptx-bounds="900 150 340 470"><rect x="900" y="150" width="340" height="470" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1070" y="195" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#0753B8">SaaS 商业模式</text><text x="940" y="255" font-family="PingFang SC" font-size="17" fill="#3E4C60">• 按年订阅</text><text x="940" y="295" font-family="PingFang SC" font-size="17" fill="#3E4C60">• 按使用量收费</text><text x="940" y="335" font-family="PingFang SC" font-size="17" fill="#3E4C60">• 知识包与规则包服务</text><rect x="940" y="385" width="260" height="105" rx="18" fill="#FFF0E7"/><text x="1070" y="425" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#D95C1A">预计年收入</text><text x="1070" y="468" text-anchor="middle" font-family="PingFang SC" font-size="31" font-weight="700" fill="#FF6B20">200—1000 万元</text><text x="1070" y="535" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">建筑招采｜其他行业采购</text><text x="1070" y="565" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">政府采购监管等场景</text></g><text id="note" data-pptx-role="footer" x="1235" y="694" text-anchor="end" font-family="PingFang SC" font-size="12" fill="#7B8CA1">目标客户、定价逻辑、销售路径与签约情况待补充</text></svg>
