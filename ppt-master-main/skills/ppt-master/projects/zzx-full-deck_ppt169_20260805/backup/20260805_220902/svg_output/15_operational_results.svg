<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" viewBox="0 0 1280 720" fill="#F5F9FF"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">15｜运行成效：风险在关键节点被实时阻断</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">从辅助审查走向实时防控，形成高风险拦截与处置解除机制</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g><g id="main-result" data-pptx-bounds="50 150 480 445"><rect x="50" y="150" width="480" height="445" rx="24" fill="#0753B8"/><text x="290" y="235" text-anchor="middle" font-family="PingFang SC" font-size="28" font-weight="700" fill="#DCEEFF">累计预警处置</text><text x="290" y="380" text-anchor="middle" font-family="Arial" font-size="120" font-weight="700" fill="#FFFFFF">9 万+</text><text x="290" y="455" text-anchor="middle" font-family="PingFang SC" font-size="21" fill="#DCEEFF">系统已从“看得见”走向“拦得住”</text><rect x="140" y="505" width="300" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.16" stroke="#A9D1FF"/><text x="290" y="536" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#FFFFFF">预警｜核查｜整改｜解除 / 升级</text></g><g id="metrics" data-pptx-bounds="600 150 630 445"><rect x="600" y="150" width="630" height="125" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="650" y="205" font-family="Arial" font-size="52" font-weight="700" fill="#42A96B">98.35%</text><text x="650" y="245" font-family="PingFang SC" font-size="18" fill="#3E4C60">预警解除率</text><rect x="600" y="300" width="630" height="125" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="650" y="355" font-family="Arial" font-size="52" font-weight="700" fill="#FF6B20">57.75%</text><text x="650" y="395" font-family="PingFang SC" font-size="18" fill="#3E4C60">高风险业务直接拦截占比</text><rect x="600" y="450" width="630" height="145" rx="20" fill="#FFF4EB" stroke="#FFD1B4"/><text x="650" y="510" font-family="Arial" font-size="48" font-weight="700" fill="#FF6B20">30% → 6%以下</text><text x="650" y="552" font-family="PingFang SC" font-size="18" fill="#3E4C60">审计漏检率显著下降</text></g><g id="footnote" data-pptx-bounds="100 630 1080 45"><text x="640" y="657" text-anchor="middle" font-family="PingFang SC" font-size="14" fill="#7B8CA1">指标定义、分母、统计周期与数据来源待补充；最终认定由授权人员依法依规作出</text></g></svg>
