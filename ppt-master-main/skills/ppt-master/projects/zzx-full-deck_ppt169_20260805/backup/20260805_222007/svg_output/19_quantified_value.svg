<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F5F9FF"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">19｜量化价值：效率、成本与风险同步改善</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">单份审查从 3 小时压缩至 3 分钟，并形成规模化降本与风险减损价值</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g><g id="hero" data-pptx-bounds="80 135 1120 230"><rect x="80" y="135" width="1120" height="220" rx="24" fill="#0753B8"/><text x="300" y="225" text-anchor="middle" font-family="PingFang SC" font-size="28" fill="#DCEEFF">人工审查</text><text x="300" y="300" text-anchor="middle" font-family="PingFang SC" font-size="70" font-weight="700" fill="#FFFFFF">3 小时</text><polygon points="540,220 640,245 540,270" fill="#FF7B2C"/><text x="650" y="245" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#FFFFFF">60×</text><text x="980" y="225" text-anchor="middle" font-family="PingFang SC" font-size="28" fill="#DCEEFF">数字合规官</text><text x="980" y="300" text-anchor="middle" font-family="PingFang SC" font-size="70" font-weight="700" fill="#FFFFFF">3 分钟</text></g><g id="value-cards" data-pptx-bounds="60 400 1160 225"><rect x="60" y="400" width="360" height="215" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="240" y="445" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#0753B8">效率价值</text><text x="240" y="505" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#0753B8">90%</text><text x="240" y="545" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#3E4C60">重复审查工作替代率</text><text x="240" y="580" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#52677F">累计节省 10 万+小时</text><rect x="460" y="400" width="360" height="215" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="640" y="445" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#0753B8">成本价值</text><text x="640" y="505" text-anchor="middle" font-family="PingFang SC" font-size="42" font-weight="700" fill="#FF6B20">2000 万元+</text><text x="640" y="545" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#3E4C60">年节约人力成本</text><text x="640" y="580" text-anchor="middle" font-family="PingFang SC" font-size="14" fill="#7B8CA1">测算公式与证明材料待补充</text><rect x="860" y="400" width="360" height="215" rx="20" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1040" y="445" text-anchor="middle" font-family="PingFang SC" font-size="24" font-weight="700" fill="#0753B8">风险价值</text><text x="1040" y="505" text-anchor="middle" font-family="PingFang SC" font-size="42" font-weight="700" fill="#42A96B">5000 万元+</text><text x="1040" y="545" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#3E4C60">每年避免直接及间接损失</text><text x="1040" y="580" text-anchor="middle" font-family="PingFang SC" font-size="14" fill="#7B8CA1">测算口径与证明材料待补充</text></g><text id="note" data-pptx-role="footer" x="640" y="680" text-anchor="middle" font-family="PingFang SC" font-size="14" fill="#6D7E93">AI 替代重复工作，不替代最终专业判断</text></svg>
