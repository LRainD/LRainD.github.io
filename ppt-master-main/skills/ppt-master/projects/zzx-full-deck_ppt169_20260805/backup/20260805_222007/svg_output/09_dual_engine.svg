<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F5F9FF"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">09｜核心引擎：规则与 AI 双引擎协同</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">确定性问题交给规则，复杂语义交给 AI，以交叉验证提高准确性与可解释性</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g><g id="pipeline" data-pptx-bounds="40 145 1200 330"><rect x="40" y="180" width="185" height="230" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="132" y="225" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#0753B8">多格式输入</text><text x="132" y="272" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#3E4C60">PDF｜Word｜Excel</text><text x="132" y="306" text-anchor="middle" font-family="PingFang SC" font-size="17" fill="#3E4C60">图片｜表格｜附件</text><image href="../images/recognition.png" x="77" y="320" width="110" height="75" preserveAspectRatio="xMidYMid meet"/><polygon points="235,280 270,295 235,310" fill="#7AAFE7"/><rect x="270" y="155" width="195" height="280" rx="18" fill="#E7F2FF" stroke="#AFCBEA"/><text x="367" y="205" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#0753B8">代码预处理</text><text x="367" y="255" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">格式识别</text><text x="367" y="288" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">文本抽取</text><text x="367" y="321" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">表格定位</text><text x="367" y="354" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">候选片段筛选</text><polygon points="475,280 510,295 475,310" fill="#7AAFE7"/><rect x="510" y="155" width="195" height="280" rx="18" fill="#0753B8"/><text x="607" y="205" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#FFFFFF">规则引擎</text><text x="607" y="255" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#DCEEFF">法规条款</text><text x="607" y="288" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#DCEEFF">企业制度</text><text x="607" y="321" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#DCEEFF">完整性与阈值</text><text x="607" y="370" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#FFFFFF">确定性检查</text><polygon points="715,280 750,295 715,310" fill="#7AAFE7"/><rect x="750" y="155" width="195" height="280" rx="18" fill="#3188D7"/><text x="847" y="205" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#FFFFFF">大模型精解析</text><text x="847" y="255" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#FFFFFF">排斥性语义</text><text x="847" y="288" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#FFFFFF">跨附件关系</text><text x="847" y="321" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#FFFFFF">资质匹配</text><text x="847" y="354" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#FFFFFF">异常一致性</text><polygon points="955,280 990,295 955,310" fill="#7AAFE7"/><rect x="990" y="180" width="250" height="230" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1115" y="225" text-anchor="middle" font-family="PingFang SC" font-size="23" font-weight="700" fill="#7B61C9">Verifier 校验</text><text x="1115" y="270" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">知识图谱 + 规则库</text><text x="1115" y="303" text-anchor="middle" font-family="PingFang SC" font-size="16" fill="#3E4C60">业务约束交叉验证</text><text x="1115" y="360" text-anchor="middle" font-family="PingFang SC" font-size="18" font-weight="700" fill="#FF6B20">风险结论 + 证据</text></g><g id="metrics" data-pptx-bounds="80 50