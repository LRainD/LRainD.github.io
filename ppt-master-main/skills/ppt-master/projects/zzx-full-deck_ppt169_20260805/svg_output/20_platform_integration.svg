<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F5F9FF"/><g id="header" data-pptx-bounds="32 20 1216 82"><text x="34" y="58" font-family="PingFang SC" font-size="32" font-weight="700" fill="#083F91">20｜跨平台对接：打通交易、监管与信用数据</text><text x="34" y="88" font-family="PingFang SC" font-size="17" fill="#5A6C82">通过标准接口和事件协同，嵌入交易平台并输出风险、证据与处置数据</text><line x1="34" y1="104" x2="1246" y2="104" stroke="#BCD3EC"/></g><g id="left-systems" data-pptx-bounds="40 160 300 410"><rect x="40" y="160" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="190" y="202" text-anchor="middle" font-family="PingFang SC" font-size="22" font-weight="700" fill="#0753B8">交易平台</text><text x="190" y="235" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">项目、公告、响应、评标、合同</text><rect x="40" y="290" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="190" y="332" text-anchor="middle" font-family="PingFang SC" font-size="22" font-weight="700" fill="#0753B8">供应商 / 资质平台</text><text x="190" y="365" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">主体、证书与有效状态</text><rect x="40" y="420" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="190" y="462" text-anchor="middle" font-family="PingFang SC" font-size="22" font-weight="700" fill="#0753B8">文件服务</text><text x="190" y="495" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">API、消息、批量交换、文件</text></g><g id="hub" data-pptx-bounds="430 180 420 360"><circle cx="640" cy="360" r="170" fill="#0753B8"/><image href="../images/platform_link.png" x="520" y="230" width="240" height="190" preserveAspectRatio="xMidYMid meet"/><text x="640" y="455" text-anchor="middle" font-family="PingFang SC" font-size="27" font-weight="700" fill="#FFFFFF">数字合规官监管中台</text><text x="640" y="490" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#DCEEFF">数据输入｜风险输出｜处置反馈</text><path d="M350 210 H470 M350 340 H470 M350 470 H470 M810 210 H930 M810 340 H930 M810 470 H930" stroke="#78AEE9" stroke-width="5"/></g><g id="right-systems" data-pptx-bounds="940 160 300 410"><rect x="940" y="160" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1090" y="202" text-anchor="middle" font-family="PingFang SC" font-size="22" font-weight="700" fill="#0753B8">监管平台</text><text x="1090" y="235" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">高风险线索、证据、处置状态</text><rect x="940" y="290" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1090" y="332" text-anchor="middle" font-family="PingFang SC" font-size="22" font-weight="700" fill="#0753B8">信用平台</text><text x="1090" y="365" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">信用、处罚、失信与主体信息</text><rect x="940" y="420" width="300" height="100" rx="18" fill="#FFFFFF" stroke="#CFE0F2"/><text x="1090" y="462" text-anchor="middle" font-family="PingFang SC" font-size="22" font-weight="700" fill="#0753B8">审计平台</text><text x="1090" y="495" text-anchor="middle" font-family="PingFang SC" font-size="15" fill="#52677F">风险事件、日志、证据链、处置</text></g><g id="governance" data-pptx-bounds="100 600 1080 70"><rect x="100" y="600" width="1080" height="65" rx="18" fill="#E8F3FF"/><text x="640" y="628" text-anchor="middle" font-family="PingFang SC" font-size="16" font-weight="700" fill="#0753B8">接口治理：身份认证｜权限控制｜数据脱敏｜调用日志｜失败重试｜版本管理</text><text x="640" y="651" text-anchor="middle" font-family="PingFang SC" font-size="13" fill="#7B8CA1">已上线、试点和规划对接需按实际平台清单区分</text></g></svg>
