spring.application.name=demo
server.port=8081

# =============================================
# LangChain4j OpenAI 配置
# =============================================
# 调用 OpenAI 接口的 API Key（请替换为你自己的 Key）
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:your-openai-api-key}

# 模型名称，例如 gpt-4o、gpt-4o-mini、gpt-3.5-turbo
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini

# 采样温度：0 ~ 2，越小越确定，越大越随机
langchain4j.open-ai.chat-model.temperature=0.7

# 单次请求超时时间
langchain4j.open-ai.chat-model.timeout=60s

# 是否打印请求/响应日志，方便本地调试
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

# 国内用户可修改 base-url 为兼容 OpenAI 协议的代理或第三方服务，例如：
# langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1
# langchain4j.open-ai.chat-model.model-name=deepseek-chat

